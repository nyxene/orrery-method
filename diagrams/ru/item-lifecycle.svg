<svg viewBox="0 0 700 300">
  <defs>
    <marker id="lc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- the six stages, as a band -->
  <g fill="none" stroke-width="1.4">
    <rect x="4"   y="40" width="104" height="38" rx="8" stroke="var(--soft)"/>
    <rect x="124" y="40" width="104" height="38" rx="8" stroke="var(--soft)"/>
    <rect x="244" y="40" width="104" height="38" rx="8" stroke="var(--teal)"/>
    <rect x="364" y="40" width="104" height="38" rx="8" stroke="var(--amber)"/>
  </g>
  <g font-size="12" font-weight="550" fill="var(--ink)" text-anchor="middle">
    <text x="56" y="64">Framing</text>
    <text x="176" y="64">Планирование</text>
    <text x="296" y="64">Исполнение</text>
    <text x="416" y="64">Verification</text>
  </g>

  <!-- what each stage reads off -->
  <g font-size="9.5" fill="var(--faint)" text-anchor="middle">
    <text x="56" y="94">ещё нет Goal</text>
    <text x="176" y="94">Goal без детей</text>
    <text x="296" y="94">открытая ветка</text>
    <text x="416" y="94">evidence опубликован</text>
  </g>

  <g stroke="var(--line2)" stroke-width="1.3" fill="none" color="var(--line2)" marker-end="url(#lc-arrow)">
    <line x1="108" y1="59" x2="120" y2="59"/>
    <line x1="228" y1="59" x2="240" y2="59"/>
    <line x1="348" y1="59" x2="360" y2="59"/>
    <line x1="468" y1="59" x2="486" y2="59"/>
  </g>

  <!-- the fan of closing acts -->
  <text x="492" y="30" font-size="10.5" fill="var(--faint)" letter-spacing="1.4">ЗАКРЫВАЮЩИЙ АКТ</text>
  <g fill="none" stroke-width="1.4">
    <rect x="492" y="47" width="204" height="24" rx="8" stroke="var(--good)"/>
    <rect x="492" y="77" width="204" height="24" rx="8" stroke="var(--rose)"/>
    <rect x="492" y="107" width="204" height="24" rx="8" stroke="var(--teal)"/>
    <rect x="492" y="137" width="204" height="24" rx="8" stroke="var(--accent)"/>
    <rect x="492" y="167" width="204" height="24" rx="8" stroke="var(--amber)"/>
  </g>
  <g font-size="11.5" fill="var(--ink)">
    <text x="506" y="63">Мерж</text>
    <text x="506" y="93">Refusal</text>
    <text x="506" y="123">Ответ</text>
    <text x="506" y="153">Внешний акт</text>
    <text x="506" y="183">Снятие</text>
  </g>
  <g font-size="9.5" fill="var(--faint)" text-anchor="end">
    <text x="684" y="63">почти вся работа</text>
    <text x="684" y="93">refused</text>
    <text x="684" y="123">research</text>
    <text x="684" y="153">настройка, развёртывание</text>
    <text x="684" y="183">Owner останавливает работу</text>
  </g>

  <!-- fan lines from verification -->
  <g stroke="var(--line2)" stroke-width="1.1" fill="none">
    <path d="M486 59 H492"/>
    <path d="M486 59 V89 H492"/>
    <path d="M486 59 V119 H492"/>
    <path d="M486 59 V149 H492"/>
    <path d="M486 59 V179 H492"/>
  </g>

  <!-- acceptance sits after, and gates nothing -->
  <rect x="4" y="212" width="464" height="42" rx="9" fill="none" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="20" y="230" font-size="12" font-weight="550" fill="var(--ink)">Приёмка</text>
  <text x="20" y="246" font-size="10" fill="var(--faint)">Owner читает после · ничто её не ждёт · она ничего не держит</text>
  <g stroke="var(--line2)" stroke-width="1.3" fill="none" color="var(--line2)" marker-end="url(#lc-arrow)">
    <path d="M594 194 V233 H472"/>
  </g>

  <g font-size="10.5" fill="var(--faint)">
    <text x="4" y="284" fill="var(--dim)">Ни одна стадия не записывается. Каждая читается по факту, который трекер уже держит.</text>
  </g>
</svg>
