    <text x="490" y="109">принимает или отвергает</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow-pair)" fill="none" opacity=".55">
    <line x1="154" y1="45" x2="208" y2="45"/><line x1="154" y1="145" x2="208" y2="145"/>
    <path d="M362 45 Q432 45 432 88 L466 88"/><path d="M362 145 Q432 145 432 102 L466 102"/>
  </g>
  <path d="M287 68 L287 122" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity=".35" fill="none" marker-end="url(#arrow-pair)"/>
  <text x="297" y="99" font-size="10.5" fill="var(--faint)">утверждённый план</text>
  <text x="545" y="150" font-size="10.5" fill="var(--dim)" text-anchor="middle">ни одна роль не проверяет собственный выход</text>
