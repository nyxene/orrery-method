<svg viewBox="0 0 700 196">
  <defs><marker id="arrow-pair" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="currentColor"/></marker></defs>
  <g fill="none" stroke-width="1.4">
    <rect x="4" y="22" width="150" height="46" rx="9" stroke="var(--teal)"/>
    <rect x="212" y="22" width="150" height="46" rx="9" stroke="var(--amber)"/>
    <rect x="4" y="122" width="150" height="46" rx="9" stroke="var(--soft)"/>
    <rect x="212" y="122" width="150" height="46" rx="9" stroke="var(--good)"/>
    <rect x="470" y="72" width="150" height="46" rx="9" stroke="var(--accent)"/>
  </g>
  <g font-size="13" font-weight="550">
    <text x="24" y="43" fill="var(--teal)">Planner</text><text x="232" y="43" fill="var(--amber)">Critic</text>
    <text x="24" y="143" fill="var(--soft)">Implementer</text><text x="232" y="143" fill="var(--good)">Auditor</text>
    <text x="490" y="93" fill="var(--accent)">Owner</text>
  </g>
